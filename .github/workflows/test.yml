name: tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"   # matches Pi OS trixie
      - run: pip install pyyaml numpy pytest mujoco scipy opencv-python-headless
      - run: python -m pytest -q
