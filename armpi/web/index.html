<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ArmPi Control</title>
<style>
  :root { --bg:#f6f6f4; --panel:#fff; --ink:#1d1d1b; --mute:#6b6b66; --line:#deded8;
          --accent:#2f6fde; --warn:#c2410c; --arm:#1d1d1b; --ghost:#b9b9b2; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#151514; --panel:#1f1f1d; --ink:#ececea; --mute:#9a9a94; --line:#33332f;
            --accent:#6c9cf0; --warn:#f08a4b; --arm:#ececea; --ghost:#55554f; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.4 system-ui, sans-serif; }
  header { display:flex; gap:16px; align-items:baseline; padding:12px 16px; border-bottom:1px solid var(--line); flex-wrap:wrap; }
  header h1 { font-size:16px; margin:0; }
  .tag { color:var(--mute); }
  .tag b { color:var(--ink); font-variant-numeric:tabular-nums; }
  .low { color:var(--warn) !important; }
  main { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:16px; padding:16px; max-width:1200px; margin:auto; }
  @media (max-width:800px) { main { grid-template-columns:1fr; } }
  section { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:14px; }
  h2 { font-size:13px; text-transform:uppercase; letter-spacing:.05em; color:var(--mute); margin:0 0 10px; }
  img.cam { width:100%; aspect-ratio:4/3; background:#000; border-radius:4px; display:block; object-fit:contain; }
  canvas { width:100%; height:240px; display:block; }
  .row { display:grid; grid-template-columns:72px 1fr 64px; gap:8px; align-items:center; margin:6px 0; }
  .row output { text-align:right; font-variant-numeric:tabular-nums; }
  input[type=range] { width:100%; accent-color:var(--accent); }
  input[type=number], select { width:100%; padding:5px 6px; border:1px solid var(--line); border-radius:4px; background:var(--bg); color:var(--ink); font:inherit; }
  button { padding:6px 10px; border:1px solid var(--line); border-radius:4px; background:var(--bg); color:var(--ink); font:inherit; cursor:pointer; }
  button:hover { border-color:var(--accent); }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  .bar { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-top:8px; }
  .bar label { color:var(--mute); }
  .xyz { display:grid; grid-template-columns:repeat(4,1fr) auto; gap:6px; align-items:end; }
  .xyz label { font-size:12px; color:var(--mute); }
  #msg { min-height:1.4em; color:var(--mute); margin-top:8px; }
  #msg.err { color:var(--warn); }
  .mono { font-family:ui-monospace, monospace; font-variant-numeric:tabular-nums; }
</style>
</head>
<body>
<header>
  <h1>ArmPi</h1>
  <span class="tag">backend <b id="backend">…</b></span>
  <span class="tag">battery <b id="battery">…</b></span>
</header>
<main>
  <section>
    <h2>Camera</h2>
    <img class="cam" id="cam" alt="camera stream">
    <h2 style="margin-top:14px">Pose (side · top)</h2>
    <canvas id="view"></canvas>
  </section>

  <section>
    <h2>Joints</h2>
    <div id="sliders"></div>
    <div class="bar">
      <label>duration ms</label><input type="number" id="dur" value="600" min="0" step="100" style="width:90px">
      <button id="rest">Rest pose</button>
    </div>

    <h2 style="margin-top:18px">Fingertip target (mm)</h2>
    <div class="xyz">
      <div><label>x</label><input type="number" id="tx" value="100"></div>
      <div><label>y</label><input type="number" id="ty" value="0"></div>
      <div><label>z</label><input type="number" id="tz" value="40"></div>
      <div><label>pitch</label><input type="number" id="tp" value="-90"></div>
      <button class="primary" id="go">Go</button>
    </div>

    <h2 style="margin-top:18px">Calibrate</h2>
    <div class="bar">
      <select id="cj" style="width:110px"></select>
      <span class="mono" id="cpulse">—</span>
    </div>
    <div class="bar">
      <button data-jog="-50">−50</button><button data-jog="-10">−10</button>
      <button data-jog="10">+10</button><button data-jog="50">+50</button>
      <label>µs per step, 300 ms each</label>
    </div>
    <div class="bar" id="marks"></div>
    <div id="msg"></div>
  </section>
</main>
<script>
const $ = id => document.getElementById(id);
let S = null;           // last /api/state
let dragging = false;

async function api(path, body) {
  const r = await fetch(path, body === undefined ? {} :
    {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)});
  const j = await r.json();
  if (!r.ok) throw new Error(j.error || r.status);
  return j;
}
function say(text, err) { $('msg').textContent = text; $('msg').className = err ? 'err' : ''; }
const dur = () => Number($('dur').value) || 0;

function buildSliders() {
  const box = $('sliders'); box.innerHTML = '';
  for (const j of S.joints) {
    const c = S.calibration[j], [lo, hi] = c.limits, step = j === 'gripper' ? 0.05 : 1;
    const row = document.createElement('div'); row.className = 'row';
    row.innerHTML = `<label>${j}</label><input type="range" min="${lo}" max="${hi}" step="${step}" id="s_${j}"><output id="o_${j}"></output>`;
    box.appendChild(row);
    const s = row.querySelector('input');
    s.value = S.angles[j] ?? c.rest;
    $('o_' + j).textContent = Number(s.value).toFixed(j === 'gripper' ? 2 : 0);
    s.oninput = () => { dragging = true; $('o_' + j).textContent = Number(s.value).toFixed(j === 'gripper' ? 2 : 0); };
    s.onchange = async () => {
      dragging = false;
      try { const r = await api('/api/move', {angles: {[j]: Number(s.value)}, duration_ms: dur()});
            say(`${j} → ${Number(r.angles[j]).toFixed(1)} in ${r.duration_ms} ms`); }
      catch (e) { say(e.message, true); }
      refresh();
    };
  }
  const sel = $('cj'); sel.innerHTML = S.joints.map(j => `<option>${j}</option>`).join('');
  sel.onchange = showMarks; showMarks();
}

function showMarks() {
  const j = $('cj').value;
  const marks = j === 'gripper' ? ['closed', 'open', 'rest'] : ['zero', 'min', 'max', 'rest', 'flip'];
  $('marks').innerHTML = marks.map(m => `<button data-mark="${m}">mark ${m}</button>`).join('') +
    (j === 'gripper' ? '' : `<label>zero angle</label><input type="number" id="zangle" style="width:70px" value="${S.calibration[j].zero_angle}">`);
  updateCal();
}

function updateCal() {
  const j = $('cj').value, us = S.pulses[j];
  $('cpulse').textContent = us === undefined ? 'position unknown: jog or move it first'
    : `${us} µs  ≈ ${Number(S.angles[j]).toFixed(1)}${j === 'gripper' ? '' : '°'}`;
}

document.addEventListener('click', async e => {
  const t = e.target;
  try {
    if (t.dataset.jog) {
      const j = $('cj').value, base = S.pulses[j] ?? null;
      if (base === null) { say('position unknown: use the slider or rest pose first', true); return; }
      const us = base + Number(t.dataset.jog);
      const r = await api('/api/pulse', {joint: j, us, duration_ms: 300});
      say(`${j} → ${us} µs (${r.duration_ms} ms)`);
    } else if (t.dataset.mark) {
      const j = $('cj').value, body = {joint: j, mark: t.dataset.mark};
      if (t.dataset.mark === 'zero') body.angle = Number($('zangle').value);
      await api('/api/calibrate', body);
      say(`saved ${t.dataset.mark} for ${j} to calibration.yaml`);
      await refresh(); buildSliders();
    } else return;
  } catch (err) { say(err.message, true); }
  refresh();
});

$('rest').onclick = async () => {
  try { const r = await api('/api/rest', {duration_ms: 1500}); say(`rest pose in ${r.duration_ms} ms`); }
  catch (e) { say(e.message, true); }
  refresh();
};
$('go').onclick = async () => {
  try {
    const r = await api('/api/move_to', {xyz: ['tx', 'ty', 'tz'].map(i => Number($(i).value)),
                                         pitch: Number($('tp').value), duration_ms: dur()});
    say(`reached with pitch ${r.pitch.toFixed(0)}°`);
  } catch (e) { say(e.message, true); }
  refresh();
};

function draw() {
  const cv = $('view'), dpr = devicePixelRatio || 1, w = cv.clientWidth, h = cv.clientHeight;
  cv.width = w * dpr; cv.height = h * dpr;
  const g = cv.getContext('2d'); g.scale(dpr, dpr); g.clearRect(0, 0, w, h);
  const css = getComputedStyle(document.documentElement);
  const ink = css.getPropertyValue('--arm'), ghost = css.getPropertyValue('--ghost'), acc = css.getPropertyValue('--accent');
  const half = w / 2, k = Math.min(half / 330, h / 330);
  // side view: r (reach, can be negative) horizontal, z up. Top view: x up, y left.
  g.strokeStyle = ghost; g.lineWidth = 1;
  g.beginPath(); g.moveTo(8, h - 20); g.lineTo(half - 8, h - 20); g.stroke();
  g.beginPath(); g.arc(half + half / 2, h / 2 + 40, 4, 0, 7); g.stroke();
  if (!S || !S.fk) { g.fillStyle = ghost; g.fillText('pose unknown until the arm is moved', 12, 20); return; }
  const chain = ['table', 'turntable', 'shoulder', 'elbow', 'wrist', 'gripper_base', 'fingertip'];
  const yaw = (S.angles.base || 0) * Math.PI / 180;
  const side = p => { const r = p[0] * Math.cos(yaw) + p[1] * Math.sin(yaw); return [half / 2 + r * k, h - 20 - p[2] * k]; };
  const top = p => [half + half / 2 - p[1] * k, h / 2 + 40 - p[0] * k];
  for (const [proj, color] of [[side, ink], [top, ink]]) {
    g.strokeStyle = color; g.lineWidth = 3; g.lineCap = 'round'; g.beginPath();
    chain.forEach((n, i) => { const [x, y] = proj(S.fk[n]); i ? g.lineTo(x, y) : g.moveTo(x, y); });
    g.stroke();
    const [fx, fy] = proj(S.fk.fingertip); g.fillStyle = acc; g.beginPath(); g.arc(fx, fy, 4, 0, 7); g.fill();
  }
  g.fillStyle = ghost; g.fillText('side', 8, 14); g.fillText('top', half + 8, 14);
  const t = S.fk.fingertip.map(v => v.toFixed(0)).join(', ');
  g.fillText(`tip ${t} mm, pitch ${S.fk.pitch_deg.toFixed(0)}°`, 8, h - 4);
}

async function refresh() {
  try { S = await api('/api/state'); } catch (e) { say('server unreachable', true); return; }
  $('backend').textContent = S.backend;
  const b = S.battery_mv;
  $('battery').textContent = b == null ? 'n/a' : (b / 1000).toFixed(2) + ' V';
  $('battery').className = b != null && b < 6800 ? 'low' : '';
  if (!dragging) for (const j of S.joints) {
    const s = $('s_' + j);
    if (s && S.angles[j] !== undefined) { s.value = S.angles[j]; $('o_' + j).textContent = Number(S.angles[j]).toFixed(j === 'gripper' ? 2 : 0); }
  }
  updateCal(); draw();
}

(async () => {
  await refresh(); if (!S) return;
  buildSliders();
  $('cam').src = '/stream.mjpg';
  $('cam').onerror = () => { $('cam').alt = 'no camera'; };
  setInterval(refresh, 1000);
  addEventListener('resize', draw);
})();
</script>
</body>
</html>
